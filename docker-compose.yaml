services:
  control-plane:
    build:
      context: ./platform/backend
    restart: unless-stopped
    init: true
    read_only: true
    pids_limit: 256
    mem_limit: "1g"
    cpus: "1"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    volumes:
      - cyberbox-control:/data
      - ./.cyberbox/browser-hunt:/browser-hunt-state:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CYBERBOX_HOME: /data
      CYBERBOX_HOST: 127.0.0.1
      CYBERBOX_PORT: "8787"
      CYBERBOX_INTERNAL_SERVICE_TOKEN: ${CYBERBOX_INTERNAL_SERVICE_TOKEN:-}
      CYBERBOX_BROWSER_BROKER_URL: http://host.docker.internal:${CYBERBOX_BROWSER_BROKER_PORT:-17890}
      CYBERBOX_BROWSER_OPERATOR_TOKEN_FILE: /browser-hunt-state/operator.key
    expose:
      - "8787"

  sandbox:
    image: ${CYBERBOX_IMAGE:-ghcr.io/prowlrbot/cybersandbox:latest}
    # Upstream /opt/gem/run.sh expects root entry so it can useradd +
    # chown /opt/jupyter, then self-drops to $USER via `su -` before
    # exec'ing supervisord. The image's Dockerfile prematurely sets
    # USER 1000, which breaks that contract. Override to root here;
    # the actual services still run as hunter at the app layer.
    user: "0:0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "unless-stopped"
    init: true
    pids_limit: 2048
    security_opt:
      - no-new-privileges:true
    shm_size: "2gb"
    mem_limit: "8g"
    cpus: "4"
    ports:
      # Local-first by default. Self-hosted deployments must opt in to an
      # external bind and place an authenticated TLS proxy in front.
      - "${CYBERBOX_BIND:-127.0.0.1}:${HOST_PORT:-8080}:8080"
    volumes:
      - cyberbox-workspace:/home/hunter
      - ./platform/nginx-control.conf:/opt/gem/nginx/control-plane.conf:ro
    depends_on:
      control-plane:
        condition: service_healthy
    environment:
      # Align runtime user with the image's build-time user (UID/GID 1000).
      # Upstream /opt/gem/run.sh defaults to USER=gem, which collides with
      # the hunter user baked into cybersandbox and crashes the container.
      USER: hunter
      USER_UID: "1000"
      USER_GID: "1000"
      PROXY_SERVER: ${PROXY_SERVER:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      DNS_OVER_HTTPS_TEMPLATES: ${DNS_OVER_HTTPS_TEMPLATES:-"https://cloudflare-dns.com/dns-query{?dns}"}
      WORKSPACE: ${WORKSPACE:-"/home/hunter"}
      HOMEPAGE: ${HOMEPAGE:-}
      BROWSER_EXTRA_ARGS: ${BROWSER_EXTRA_ARGS:-}
      TZ: ${TZ:-Asia/Singapore}
      DISPLAY_WIDTH: ${DISPLAY_WIDTH:-1280}
      DISPLAY_HEIGHT: ${DISPLAY_HEIGHT:-1024}
      WAIT_PORTS: "8079,8091"
      VNC_SERVER_PORT: 5900
      PUBLIC_PORT: 8080
      AUTH_BACKEND_PORT: 8081
      WEBSOCKET_PROXY_PORT: 6080
      GEM_SERVER_PORT: 8088
      MCP_HUB_PORT: 8079
      SANDBOX_SRV_PORT: 8091
      JUPYTER_LAB_PORT: 8888
      CODE_SERVER_PORT: 8200
      MCP_SERVER_BROWSER_PORT: 8100
      TINYPROXY_PORT: 8118
      MCP_SERVER_MARKITDOWN_PORT: 8101
      MCP_SERVER_CHROME_DEVTOOLS_PORT: 8102
      BROWSER_REMOTE_DEBUGGING_PORT: 9222
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
      UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-https://pypi.org/simple}
      NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org}
      # for gh cli
      GITHUB_TOKEN: ""
      # Claude Skills
      AIO_SKILLS_PATH: ${AIO_SKILLS_PATH:-}
      # Features
      DISABLE_JUPYTER: ${DISABLE_JUPYTER:-false}
      DISABLE_CODE_SERVER: ${DISABLE_CODE_SERVER:-false}
      CYBERBOX_CONTROL_PLANE_URL: http://control-plane:8787/health
      CYBERBOX_INTERNAL_SERVICE_TOKEN: ${CYBERBOX_INTERNAL_SERVICE_TOKEN:-}

volumes:
  cyberbox-workspace:
  cyberbox-control:
