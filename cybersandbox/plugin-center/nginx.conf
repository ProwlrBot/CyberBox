location = /csbx { return 302 /csbx/; }
location /csbx/ {
    proxy_pass http://127.0.0.1:8199/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Content-Security-Policy "default-src 'self' data:; frame-ancestors 'self'; object-src 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
}

# CyberBox platform frontend (React app served via FastAPI on host)
location = /app { return 302 /app/; }
location /app/ {
    proxy_pass http://host.docker.internal:8787/app/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# CyberBox API — forward to FastAPI control plane on host
location /api/ {
    proxy_pass http://host.docker.internal:8787/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
}

# CyberBox WebSocket hub
location /ws/ {
    proxy_pass http://host.docker.internal:8787/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_read_timeout 3600s;
}
